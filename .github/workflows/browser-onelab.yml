name: Browser ONELAB

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fetch-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Acquire Giac WASM
        run: nice npm run giac:acquire
      - name: Fetch exact locked WASM release
        run: nice npm run simulation:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASM_RELEASE_REPO: ${{ github.repository }}
      - name: No-recompile deployment build
        run: nice npm run build:deploy
      - name: Unit and type checks
        run: nice npm run typecheck && nice npm test
      - name: Clean-deployment production E2E
        run: nice npx playwright test --config playwright.simulation.config.ts
      - name: Separate-profile Phase 0-4 production E2E
        run: nice npm run test:simulation:separate
