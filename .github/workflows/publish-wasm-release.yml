name: Publish WASM Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful WASM Release Candidate run ID
        required: true
        type: string
      content_version:
        description: Exact contentVersion to publish
        required: true
        type: string

permissions:
  actions: write
  attestations: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Validate successful candidate and main reachability
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          REQUESTED_VERSION: ${{ inputs.content_version }}
        shell: bash
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r .conclusion <<<"$RUN")" = success
          test "$(jq -r .path <<<"$RUN")" = .github/workflows/wasm-candidate.yml
          test "$(jq -r .event <<<"$RUN")" = workflow_dispatch
          test "$(jq -r .head_branch <<<"$RUN")" = main
          test "$(jq -r .head_repository.full_name <<<"$RUN")" = "$GITHUB_REPOSITORY"
          SHA=$(jq -r .head_sha <<<"$RUN")
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$SHA" origin/main
          git checkout --detach "$SHA"
          VERSION=$(node -p "require('./tools/wasm/artifacts.lock.json').contentVersion")
          test "$VERSION" = "$REQUESTED_VERSION"
          TAG="wasm-$VERSION"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact=wasm-$VERSION-candidate-$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download candidate handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify candidate assets before publication
        run: npm run simulation:release:verify -- candidate
      - name: Verify candidate provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          for artifact in candidate/*; do
            test -f "$artifact"
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wasm-candidate.yml" \
              --signer-digest "$SHA" \
              --source-digest "$SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners >/dev/null
          done
      - name: Create guarded draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          RELEASE=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$SHA" -f name="$TAG" \
            -f body='Deterministic browser simulation runtime. See release-metadata.json and corresponding-source.json.' \
            -F draft=true -F prerelease=false -f make_latest=false)
          echo "release_id=$(jq -r .id <<<"$RELEASE")" >> "$GITHUB_OUTPUT"
          test "$(jq -r .draft <<<"$RELEASE")" = true
      - name: Upload candidate assets without clobbering
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: gh release upload "$TAG" candidate/*
      - name: Verify draft tag, target, and exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          test "$(jq -r .tag_name <<<"$RELEASE")" = "$TAG"
          test "$(jq -r .target_commitish <<<"$RELEASE")" = "$SHA"
          test "$(jq -r .draft <<<"$RELEASE")" = true
          test "$(jq -r .prerelease <<<"$RELEASE")" = false
          diff -u <(jq -r '.assets[].name' <<<"$RELEASE" | sort) <(find candidate -maxdepth 1 -type f -printf '%f\n' | sort)
          (cd candidate && sha256sum -c SHA256SUMS)
      - name: Publish verified immutable-style release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=false >/dev/null
      - name: Verify published release by exact fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASM_RELEASE_REPO: ${{ github.repository }}
        run: npm run simulation:fetch
      - name: Dispatch Pages deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Clean up only this run's unpublished draft and tag
        if: ${{ failure() && steps.create.outputs.release_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          TAG: ${{ steps.candidate.outputs.tag }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" 2>/dev/null) || exit 0
          if [[ $(jq -r .draft <<<"$RELEASE") != true || $(jq -r .tag_name <<<"$RELEASE") != "$TAG" ]]; then
            echo "refusing cleanup: release is published or no longer belongs to this run"
            exit 0
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null) || exit 0
          if [[ $(jq -r .object.type <<<"$REF") == commit && $(jq -r .object.sha <<<"$REF") == "$SHA" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          else
            echo "refusing tag cleanup: tag target is not the candidate commit"
          fi
