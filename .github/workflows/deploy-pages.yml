name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: nice -n 10 npm ci
      - name: Generate deterministic data
        run: |
          nice -n 10 npm run data:generate -- --external-corpus-mode=artifact
          nice -n 10 npm run data:generate:fiddles
          nice -n 10 npm run data:generate:fiddle-runtime
          nice -n 10 npm run gray:compile:check
          git diff --exit-code -- public/data/generated
          test -z "$(git ls-files --others --exclude-standard -- public/data/generated)"
      - name: Typecheck
        run: nice -n 10 npm run typecheck
      - name: Test all Vitest suites
        run: nice -n 10 npm test
      - name: Test and validate all FEM contracts
        run: nice -n 10 npm run fem:validate
      - name: Install Chromium
        run: nice -n 10 npx playwright install --with-deps chromium
      - name: Test Gray workbench in Chromium
        run: nice -n 10 npm run e2e:gray
      - name: Test production-preview PWA
        run: nice -n 10 npm run e2e:pwa
      - name: Build static site for Pages
        run: nice -n 10 npm run build:pages
        env:
          VITE_BASE_PATH: /opensimphy/
      - name: Check route boundaries
        run: |
          nice -n 10 npm run check:routes
          nice -n 10 npm run check:awesome-physics
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
